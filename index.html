<!DOCTYPE html>
<html>
<head>
    <title>Grand Palace Hotel</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
            text-align: center;
        }

        header {
            background-color: #17365d;
            color: white;
            padding: 25px;
        }

        h2 {
            color: #17365d;
        }

        .rooms {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 20px;
        }

        .room {
            background: white;
            width: 280px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #aaa;
        }

        .room img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        button {
            background: #17365d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background: #17365d;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>Grand Palace Hotel</h1>
    <p>Welcome to our Hotel Room Booking System</p>
</header>

<h2>Available Hotel Rooms</h2>

<div class="rooms">

    <div class="room">
        <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=600">
        <h3>Single Room</h3>
        <p>Price: ₹1500 per night</p>
        <p>Availability: Available</p>
        <button onclick="bookRoom('Single Room')">Book Now</button>
    </div>

    <div class="room">
        <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=600">
        <h3>Double Room</h3>
        <p>Price: ₹2500 per night</p>
        <p>Availability: Available</p>
        <button onclick="bookRoom('Double Room')">Book Now</button>
    </div>

    <div class="room">
        <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=600">
        <h3>Deluxe Room</h3>
        <p>Price: ₹4000 per night</p>
        <p>Availability: Available</p>
        <button onclick="bookRoom('Deluxe Room')">Book Now</button>
    </div>

</div>

<footer>
    <p>© 2026 Grand Palace Hotel</p>
</footer>

<script>
    function bookRoom(room) {
        alert("You selected: " + room);
    }
</script>

</body>
</html>
